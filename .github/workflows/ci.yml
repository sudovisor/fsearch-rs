name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  windows:
    # cross-built with MinGW, like the release packages (packaging/windows/build-windows.sh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: MinGW and NSIS
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis
      - uses: Swatinem/rust-cache@v2
      - run: packaging/windows/build-windows.sh target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fsearch-windows
          path: |
            target/dist/*.exe
            target/dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Python dependencies
        run: pip3 install pillow
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/build-macos.sh target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fsearch-macos
          path: |
            target/dist/*.zip
            target/dist/*.dmg
