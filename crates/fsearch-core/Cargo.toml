[package]
name = "fsearch-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
fsearch-string-utils-rs = { version = "0.1.0", path = "../fsearch-string-utils" }
icu_casemap = "2"
icu_normalizer = "2"
icu_properties = "2"
md-5 = "0.11.0"
memchr = "2.8.3"
pcre2 = "0.2.11"
pcre2-sys = "0.2"
rayon = "1.12.0"
thread_local = "1.1.10"
writeable = "0.6"

[dev-dependencies]
md-5 = "0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
libc = "0.2.191"
